<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AB Industrial Supplies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Load PapaParse for Google Sheets CSV -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Load SheetJS (XLSX) for Exporting -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- Import map for dependencies -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
        "motion/react": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      Search, ShoppingCart, Phone, MapPin, Wrench, CheckCircle, 
      Clock, Package, Menu, X, Facebook, Instagram, ChevronRight, Plus,
      Download, Upload, TrendingUp, ClipboardList, CreditCard
    } from 'lucide-react';
    import { motion, AnimatePresence } from 'motion/react';

    // --- Mock Data Fallback ---
    const DEFAULT_TOOLS = [
      { id: 1, model: "640102", name: "Harden 18pcs Professional Tool Set", price: 7500, oldPrice: 8200, description: "Complete repair kit with high-quality CR-V steel for industrial maintenance. Includes wrenches, pliers, screwdrivers, and socket sets all in a durable hard case.", category: "Tool Sets", image: "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?auto=format&fit=crop&q=80&w=400", isNew: true, stock: 45 },
      { id: 2, model: "580112", name: "Harden Claw Hammer 0.50kg", price: 1450, oldPrice: 1600, description: "Shock-absorbing tubular handle with drop-forged high carbon steel head. Ergonomic grip designed to reduce fatigue during heavy repetitive striking.", category: "Hand Tools", image: "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?auto=format&fit=crop&q=80&w=400", isNew: false, stock: 120 },
      { id: 3, model: "750601", name: "Harden 20V Lithium-Ion Cordless Drill", price: 15800, oldPrice: 17500, description: "High-power 20V drill with 2-speed gearbox and 13mm chuck for tough jobs. Features an LED work light and comes with 2 batteries and a fast charger.", category: "Power Tools", image: "https://images.unsplash.com/photo-1540104539488-92a51bbc0410?auto=format&fit=crop&q=80&w=400", isNew: true, stock: 15 },
      { id: 4, model: "750231", name: "Harden Angle Grinder 850W", price: 9200, oldPrice: 10500, description: "Industrial grade 115mm angle grinder for professional metal cutting and grinding. Heavy-duty motor built for continuous operations.", category: "Power Tools", image: "https://images.unsplash.com/photo-1530124566582-aa61dd3c9dca?auto=format&fit=crop&q=80&w=400", isNew: false, stock: 22 },
      { id: 5, model: "530106", name: "Harden 45pcs Screwdriver Bit Set", price: 1850, oldPrice: 2100, description: "Multi-functional bit set with magnetic holder. Precision engineered for perfect fit and durability. Essential for any toolbox.", category: "Accessories", image: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&q=80&w=400", isNew: true, stock: 65 },
      { id: 6, model: "610202", name: "Harden 5m Steel Measuring Tape", price: 650, oldPrice: 750, description: "Nylon coated blade with strong magnetic hook and anti-impact case. Highly visible numbers and smooth locking mechanism.", category: "Measuring Tools", image: "https://images.unsplash.com/photo-1501720888122-c3226a27e4e1?auto=format&fit=crop&q=80&w=400", isNew: false, stock: 200 }
    ];

    function App() {
      // --- States ---
      const [view, setView] = useState('shop'); // 'shop' or 'admin'
      const [searchQuery, setSearchQuery] = useState('');
      
      // Cart & Modal States
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedTool, setSelectedTool] = useState(null);

      // Data States
      const [products, setProducts] = useState(DEFAULT_TOOLS);
      const [isLoading, setIsLoading] = useState(true);

      // --- GitHub CSV Integration ---
      // This reads from the local inventory.csv file sitting next to index.html
      const CSV_URL = "./inventory.csv";

      useEffect(() => {
        Papa.parse(CSV_URL, {
          download: true,
          header: true,
          complete: (results) => {
            const newProducts = results.data
              .filter(row => row.Name || row.name)
              .map((row, index) => ({
                id: index + 1,
                model: row.Model || row.model || "N/A",
                name: row.Name || row.name || "Unknown Tool",
                price: Number(row.Price || row.price || 0),
                oldPrice: row.OldPrice ? Number(row.OldPrice) : undefined,
                description: row.Description || row.description || "",
                category: row.Category || row.category || "Hand Tools",
                image: row.Image || row.image || "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?auto=format&fit=crop&q=80&w=400",
                isNew: String(row.IsNew || row.isNew).toLowerCase() === 'true',
                stock: Number(row.Stock || row.stock || 0)
              }));
            
            if (newProducts.length > 0) {
              setProducts(newProducts);
            }
            setIsLoading(false);
          },
          error: (err) => {
            console.error("Failed to load Google Sheet, using fallback data:", err);
            setIsLoading(false);
          }
        });
      }, []);

      // --- Search Logic ---
      const filteredTools = useMemo(() => {
        return products.filter(tool => 
          tool.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.model.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [searchQuery, products]);

      // --- Cart Logic ---
      const addToCart = (tool, quantity = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === tool.id);
          if (existing) {
            return prev.map(item => item.id === tool.id ? { ...item, quantity: item.quantity + quantity } : item);
          }
          return [...prev, { ...tool, quantity }];
        });
        setSelectedTool(null); // Close modal
        setIsCartOpen(true);   // Open cart drawer
      };

      const updateCartQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQ = item.quantity + delta;
            return newQ > 0 ? { ...item, quantity: newQ } : item;
          }
          return item;
        }));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const cartItemsCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      const contactUs = () => {
        window.open('https://wa.me/923328201152', '_blank');
      };

      // --- Admin Export Functions ---
      const downloadTemplate = () => {
        const templateData = [
          { Model: "640102", Name: "Harden New Tool", Price: 1500, OldPrice: 1800, Category: "Hand Tools", Stock: 50, Image: "https://images.unsplash.com/photo-...", Description: "Description here", IsNew: "true" }
        ];
        const ws = XLSX.utils.json_to_sheet(templateData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "InventoryTemplate");
        XLSX.writeFile(wb, "inventory.xlsx");
      };

      const exportInventory = () => {
        const data = products.map(p => ({
          Model: p.model,
          Name: p.name,
          Category: p.category,
          Price: p.price,
          OldPrice: p.oldPrice || "",
          Stock: p.stock || 0,
          IsNew: p.isNew
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "CurrentInventory");
        XLSX.writeFile(wb, "AB_Industrial_Inventory_Backup.xlsx");
      };

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-900 overflow-x-hidden">
          {/* --- Navigation --- */}
          <nav className="sticky top-0 z-50 bg-[#1A1A1A] text-white shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-20">
                {/* Logo - Click to toggle Admin */}
                <div 
                  className="flex items-center gap-2 cursor-pointer" 
                  onClick={() => setView(view === 'shop' ? 'admin' : 'shop')}
                  title="Click to toggle Admin Panel"
                >
                  <div className="bg-orange-500 p-2 rounded-lg">
                    <Wrench className="w-6 h-6 text-white" />
                  </div>
                  <span className="text-2xl font-black tracking-tighter text-white">
                    AB INDUSTRIAL <span className="text-orange-500">SUPPLIES</span>
                  </span>
                </div>

                {/* Desktop Search (Only in Shop view) */}
                {view === 'shop' && (
                  <div className="hidden md:flex flex-1 max-w-md mx-8 relative">
                    <input
                      type="text"
                      placeholder="Search tools (e.g. Drill, Hammer)..."
                      className="w-full bg-[#2A2A2A] border-none rounded-full py-2 px-6 pl-12 text-sm focus:ring-2 focus:ring-orange-500 transition-all text-white outline-none"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                    <Search className="absolute left-4 top-2.5 w-4 h-4 text-slate-400" />
                  </div>
                )}

                {/* Actions */}
                <div className="hidden md:flex items-center gap-6">
                  {view === 'admin' ? (
                    <button 
                      onClick={() => setView('shop')}
                      className="bg-orange-500 px-4 py-2 rounded-lg font-bold text-sm"
                    >
                      Back to Shop
                    </button>
                  ) : (
                    <>
                      <div className="flex flex-col items-end">
                        <span className="text-xs text-slate-400">Order Now</span>
                        <span className="text-sm font-bold">03328201 152</span>
                      </div>
                      <button 
                        className="relative p-2 hover:bg-white/10 rounded-full transition-colors"
                        onClick={() => setIsCartOpen(true)}
                      >
                        <ShoppingCart className="w-6 h-6" />
                        {cartItemsCount > 0 && (
                          <span className="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md">
                            {cartItemsCount}
                          </span>
                        )}
                      </button>
                    </>
                  )}
                </div>
              </div>
            </div>
          </nav>

          {/* MAIN CONTENT AREA */}
          {isLoading ? (
            <div className="flex flex-col items-center justify-center py-32">
               <Wrench className="w-12 h-12 text-orange-500 animate-spin mb-4" />
               <p className="text-slate-500 font-bold uppercase tracking-widest">Loading Inventory...</p>
            </div>
          ) : view === 'admin' ? (
            /* --- Admin Dashboard View --- */
            <main className="max-w-7xl mx-auto px-4 py-12 animate-in fade-in duration-500">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                <div>
                  <h2 className="text-4xl font-black tracking-tighter">MANAGEMENT <span className="text-orange-500">DASHBOARD</span></h2>
                  <p className="text-slate-500 font-bold uppercase text-xs tracking-widest mt-1">Export & Sync Tools</p>
                </div>
                <div className="flex gap-4">
                  <button 
                    onClick={downloadTemplate}
                    className="flex items-center gap-2 px-6 py-3 bg-white border border-slate-200 rounded-xl text-xs font-black hover:bg-slate-50 shadow-sm transition-all"
                  >
                    <Download className="w-4 h-4 text-orange-500" /> Download GitHub Format Template
                  </button>
                  <button 
                    onClick={exportInventory}
                    className="flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-xl text-xs font-black hover:bg-slate-800 shadow-xl transition-all"
                  >
                    <Download className="w-4 h-4" /> Backup Current Inventory (Excel)
                  </button>
                </div>
              </div>

              <div className="bg-orange-50 border border-orange-200 rounded-2xl p-6 mb-8 flex items-start gap-4">
                <TrendingUp className="w-6 h-6 text-orange-600 mt-1 flex-shrink-0" />
                <div>
                  <h3 className="font-black text-orange-800">How to update prices permanently:</h3>
                  <p className="text-sm text-orange-700 mt-1">
                    Your website reads directly from the <strong>inventory.csv</strong> file in your GitHub repository. 
                    <br/><br/>
                    To change a price or add a tool: Log into GitHub.com, open the <strong>inventory.csv</strong> file, click the pencil icon to edit, make your changes, and click "Commit changes". Vercel will automatically update the website!
                  </p>
                </div>
              </div>

              <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                <table className="w-full text-left">
                  <thead className="bg-slate-50 text-[10px] font-black uppercase tracking-widest text-slate-400">
                    <tr>
                      <th className="px-8 py-4">Model</th>
                      <th className="px-8 py-4">Item Name</th>
                      <th className="px-8 py-4">Category</th>
                      <th className="px-8 py-4">Price (PKR)</th>
                      <th className="px-8 py-4">Stock</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {products.map(p => (
                      <tr key={p.id} className="hover:bg-slate-50 transition-colors">
                        <td className="px-8 py-6 font-mono text-xs font-bold text-slate-500">{p.model}</td>
                        <td className="px-8 py-6">
                          <div className="flex items-center gap-4">
                            <img src={p.image} className="w-12 h-12 rounded-lg bg-slate-100 object-cover" />
                            <p className="font-black text-sm">{p.name}</p>
                          </div>
                        </td>
                        <td className="px-8 py-6 font-bold text-xs text-slate-500 uppercase">{p.category}</td>
                        <td className="px-8 py-6 font-black text-orange-600">Rs {p.price.toLocaleString()}</td>
                        <td className="px-8 py-6 font-mono font-bold">{p.stock || 'N/A'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </main>
          ) : (
            /* --- Shop View --- */
            <>
              {/* --- Hero Section --- */}
              <section className="relative bg-[#1A1A1A] text-white py-16 lg:py-24 overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-r from-orange-500/10 to-transparent pointer-none" />
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                  <div className="grid lg:grid-cols-2 gap-12 items-center">
                    <motion.div
                      initial={{ x: -50, opacity: 0 }}
                      whileInView={{ x: 0, opacity: 1 }}
                      viewport={{ once: true }}
                    >
                      <span className="inline-block px-4 py-1.5 bg-orange-500 text-xs font-bold rounded-full mb-6 uppercase tracking-widest">
                        Official Supplier in Pakistan
                      </span>
                      <h1 className="text-5xl lg:text-7xl font-black leading-tight mb-6">
                        TOUGH TOOLS FOR <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-orange-600">SMART WORK</span>
                      </h1>
                      <p className="text-lg text-slate-300 mb-8 max-w-lg">
                        Genuine Harden Tools available at wholesale prices. Powering industries and workshops across Pakistan since 1996.
                      </p>
                      <div className="flex flex-wrap gap-4">
                        <button 
                          onClick={() => document.getElementById('all-products')?.scrollIntoView({ behavior: 'smooth' })}
                          className="px-8 py-4 bg-orange-500 hover:bg-orange-600 rounded-xl font-bold transition-all shadow-lg shadow-orange-500/20"
                        >
                          Shop Now
                        </button>
                        <button 
                          onClick={contactUs}
                          className="px-8 py-4 bg-white/10 hover:bg-white/20 rounded-xl font-bold transition-all flex items-center gap-2 border border-white/10"
                        >
                          Request a Quote <ChevronRight className="w-4 h-4" />
                        </button>
                      </div>
                    </motion.div>
                  </div>
                </div>
              </section>

              {/* --- Main Shop Area --- */}
              <section id="all-products" className="bg-slate-100 py-20 lg:py-28">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
                    <div>
                      <h2 className="text-4xl font-black uppercase tracking-tight text-center md:text-left">
                        {searchQuery ? `Search results for "${searchQuery}"` : "All Industrial Tools"}
                      </h2>
                    </div>
                    <div className="flex gap-2 flex-wrap justify-center">
                      {['Power Tools', 'Hand Tools', 'Tool Sets', 'Accessories'].map(cat => (
                        <button 
                          key={cat}
                          onClick={() => setSearchQuery(cat)}
                          className={`px-4 py-2 rounded-full text-sm font-bold border transition-all ${
                            searchQuery === cat ? 'bg-orange-500 border-orange-500 text-white' : 'bg-white border-slate-200 text-slate-600 hover:border-orange-500'
                          }`}
                        >
                          {cat}
                        </button>
                      ))}
                      {searchQuery && (
                        <button 
                          onClick={() => setSearchQuery('')}
                          className="px-4 py-2 bg-slate-800 text-white rounded-full text-sm font-bold"
                        >
                          Reset
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {filteredTools.map(tool => (
                      <ProductCard key={tool.id} tool={tool} onSelect={() => setSelectedTool(tool)} />
                    ))}
                  </div>
                  
                  {filteredTools.length === 0 && (
                    <div className="text-center py-20">
                      <Search className="w-16 h-16 text-slate-300 mx-auto mb-4" />
                      <h3 className="text-2xl font-bold text-slate-400">No tools found matching your request</h3>
                    </div>
                  )}
                </div>
              </section>
            </>
          )}

          {/* --- Cart Drawer --- */}
          <AnimatePresence>
            {isCartOpen && (
              <>
                <motion.div 
                  initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                  onClick={() => setIsCartOpen(false)}
                  className="fixed inset-0 bg-black/50 z-[60] backdrop-blur-sm"
                />
                <motion.div 
                  initial={{ x: '100%' }} animate={{ x: 0 }} exit={{ x: '100%' }}
                  className="fixed top-0 right-0 h-full w-full max-w-md bg-white z-[70] shadow-2xl flex flex-col"
                >
                  <div className="p-6 border-b border-slate-100 flex justify-between items-center bg-[#1A1A1A] text-white">
                    <h2 className="text-xl font-black flex items-center gap-2"><ShoppingCart /> Your Cart</h2>
                    <button onClick={() => setIsCartOpen(false)} className="hover:text-orange-500 transition-colors"><X /></button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50">
                    {cart.length === 0 ? (
                      <div className="flex flex-col items-center justify-center h-full opacity-50">
                        <ShoppingCart className="w-16 h-16 mb-4" />
                        <p className="font-bold">Your cart is empty.</p>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="flex gap-4 items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                          <img src={item.image} className="w-16 h-16 object-cover rounded-xl bg-slate-50" />
                          <div className="flex-1">
                            <p className="font-bold text-sm leading-tight line-clamp-1">{item.name}</p>
                            <p className="text-orange-600 font-black text-sm">Rs {item.price.toLocaleString()}</p>
                            <div className="flex items-center gap-3 mt-2">
                              <button onClick={() => updateCartQuantity(item.id, -1)} className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center font-bold hover:bg-slate-200">-</button>
                              <span className="font-bold text-sm">{item.quantity}</span>
                              <button onClick={() => updateCartQuantity(item.id, 1)} className="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center font-bold hover:bg-slate-200">+</button>
                            </div>
                          </div>
                          <button onClick={() => removeFromCart(item.id)} className="text-slate-300 hover:text-red-500 transition-colors">
                            <X className="w-5 h-5" />
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                  
                  {cart.length > 0 && (
                    <div className="p-6 border-t border-slate-100 bg-white">
                      <div className="flex justify-between items-center mb-6">
                        <span className="text-slate-500 font-bold">Total Amount</span>
                        <span className="text-2xl font-black text-slate-900">Rs {cartTotal.toLocaleString()}</span>
                      </div>
                      <CheckoutForm cart={cart} total={cartTotal} />
                    </div>
                  )}
                </motion.div>
              </>
            )}
          </AnimatePresence>

          {/* --- Product Details Modal --- */}
          <AnimatePresence>
            {selectedTool && (
              <>
                <motion.div 
                  initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                  onClick={() => setSelectedTool(null)}
                  className="fixed inset-0 bg-black/60 z-[80] backdrop-blur-sm p-4 flex items-center justify-center"
                >
                  <motion.div 
                    initial={{ scale: 0.95, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.95, opacity: 0 }}
                    onClick={e => e.stopPropagation()}
                    className="bg-white rounded-3xl overflow-hidden shadow-2xl max-w-4xl w-full flex flex-col md:flex-row max-h-[90vh]"
                  >
                    <div className="md:w-1/2 bg-slate-50 p-8 flex items-center justify-center relative">
                      <button onClick={() => setSelectedTool(null)} className="absolute top-4 left-4 w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-md md:hidden"><X /></button>
                      <img src={selectedTool.image} className="w-full h-auto max-h-80 object-contain mix-blend-multiply" />
                    </div>
                    <div className="md:w-1/2 p-8 md:p-10 flex flex-col overflow-y-auto">
                      <button onClick={() => setSelectedTool(null)} className="absolute top-6 right-6 hidden md:block text-slate-400 hover:text-slate-900"><X className="w-8 h-8" /></button>
                      <div className="mb-2 flex items-center gap-3">
                        <span className="bg-orange-100 text-orange-600 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest">{selectedTool.category}</span>
                        <span className="font-mono text-slate-500 font-bold text-sm">Model: #{selectedTool.model}</span>
                      </div>
                      <h2 className="text-3xl md:text-4xl font-black tracking-tight mb-4">{selectedTool.name}</h2>
                      <div className="flex items-end gap-3 mb-6">
                        <span className="text-4xl font-black text-slate-900">Rs {selectedTool.price.toLocaleString()}</span>
                        {selectedTool.oldPrice && <span className="text-lg text-slate-400 line-through font-bold mb-1">Rs {selectedTool.oldPrice.toLocaleString()}</span>}
                      </div>
                      <p className="text-slate-600 text-base leading-relaxed mb-8 flex-1">{selectedTool.description}</p>
                      
                      <div className="bg-slate-50 p-4 rounded-2xl mb-8 flex items-center gap-4 border border-slate-100">
                        <Package className="w-6 h-6 text-orange-500" />
                        <div>
                          <p className="font-bold text-slate-900 text-sm">Stock Status</p>
                          <p className="text-xs text-slate-500">{selectedTool.stock > 0 ? `${selectedTool.stock} units available ready to ship` : 'Out of stock'}</p>
                        </div>
                      </div>

                      <button 
                        onClick={() => addToCart(selectedTool)}
                        className="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-black text-lg transition-colors flex items-center justify-center gap-2 shadow-xl shadow-orange-500/20"
                      >
                        <ShoppingCart className="w-5 h-5" /> Add to Cart
                      </button>
                    </div>
                  </motion.div>
                </motion.div>
              </>
            )}
          </AnimatePresence>

        </div>
      );
    }

    // --- Components ---

    function ProductCard({ tool, onSelect }) {
      return (
        <motion.div
          whileHover={{ y: -5 }}
          onClick={onSelect}
          className="bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl transition-all border border-slate-200 flex flex-col h-full group cursor-pointer"
        >
          <div className="relative aspect-square rounded-2xl overflow-hidden mb-6 bg-slate-50">
            <img 
              src={tool.image} 
              alt={tool.name} 
              className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
              loading="lazy"
            />
            {tool.isNew && (
              <span className="absolute top-4 left-4 bg-orange-500 text-white text-[10px] font-black uppercase px-3 py-1 rounded-full z-10">
                New
              </span>
            )}
          </div>
          
          <div className="flex-1 flex flex-col">
            <div className="flex justify-between items-start mb-2">
              <span className="text-[10px] font-bold uppercase tracking-widest text-slate-400">{tool.category}</span>
              <span className="text-[10px] font-mono font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded">#{tool.model}</span>
            </div>
            <h3 className="font-black text-lg text-slate-800 leading-tight mb-3 transition-colors group-hover:text-orange-600 line-clamp-2">
              {tool.name}
            </h3>
            
            <div className="flex items-center justify-between mt-auto pt-4 border-t border-slate-50">
              <div>
                <p className="text-xs text-slate-400 line-through font-bold">{tool.oldPrice ? `Rs ${tool.oldPrice.toLocaleString()}` : ''}</p>
                <p className="text-2xl font-black text-slate-900 leading-none">
                  <span className="text-xs font-bold mr-1">Rs</span>
                  {tool.price.toLocaleString()}
                </p>
              </div>
              <div className="w-10 h-10 bg-slate-50 text-slate-400 rounded-full flex items-center justify-center group-hover:bg-slate-900 group-hover:text-white transition-colors">
                <ChevronRight className="w-5 h-5" />
              </div>
            </div>
          </div>
        </motion.div>
      );
    }

    function CheckoutForm({ cart, total }) {
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');

      const placeOrder = (e) => {
        e.preventDefault();
        
        let message = `*NEW ORDER - AB INDUSTRIAL*\n\n`;
        message += `*Customer Details:*\n`;
        message += `Name: ${name}\n`;
        message += `Phone: ${phone}\n`;
        message += `Address: ${address}\n\n`;
        message += `*Order Items:*\n`;
        
        cart.forEach((item, index) => {
          message += `${index + 1}. [${item.model}] ${item.name}\n`;
          message += `   ${item.quantity} x Rs ${item.price} = Rs ${item.quantity * item.price}\n`;
        });
        
        message += `\n*TOTAL: Rs ${total.toLocaleString()}*\n`;
        
        const encodedMessage = encodeURIComponent(message);
        window.open(`https://wa.me/923328201152?text=${encodedMessage}`, '_blank');
      };

      return (
        <form onSubmit={placeOrder} className="flex flex-col gap-3">
          <input required type="text" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm font-bold bg-slate-50" />
          <input required type="tel" placeholder="Phone Number" value={phone} onChange={e=>setPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm font-bold bg-slate-50" />
          <textarea required placeholder="Complete Delivery Address" value={address} onChange={e=>setAddress(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-orange-500 outline-none text-sm font-bold resize-none h-20 bg-slate-50"></textarea>
          <button type="submit" className="w-full py-4 bg-orange-500 text-white rounded-xl font-black mt-2 hover:bg-orange-600 transition-colors shadow-xl shadow-orange-500/20">
            Confirm & Send via WhatsApp
          </button>
        </form>
      )
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
